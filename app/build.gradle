plugins { id 'com.android.application' }
def apkVersionCode = providers.gradleProperty('distributionCode').orElse('3').get().toInteger()
def apkVersionName = providers.gradleProperty('distributionName').orElse('0.2.2').get()
android {
    namespace 'io.github.zetatools.gecko'
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }
    defaultConfig {
        applicationId 'io.github.zetatools.gecko'
        minSdk 26
        targetSdk 34
        versionCode = apkVersionCode
        versionName = apkVersionName
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        if (System.getenv('ZETA_SIGNING_FILE')) {
            release {
                storeFile = project.file(System.getenv('ZETA_SIGNING_FILE'))
                storePassword = System.getenv('ZETA_SIGNING_PASSWORD')
                keyAlias = 'zeta-release'
                keyPassword = System.getenv('ZETA_SIGNING_PASSWORD')
                storeType = 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ZETA_SIGNING_FILE')) signingConfig = signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455' }
